name: Forja del APK de Bannerlator MALI Anti-Overflow

on:
  workflow_dispatch:

jobs:
  build-bannerlator-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio de Bannerlator
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Configurar Entorno de Java (JDK 17 reglamentario)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Activar Android SDK y NDK del Servidor
        uses: android-actions/setup-android@v3

      - name: Modificar el Silicio de Bannerlator (Bypass Anti-Desbordamiento MALI)
        run: |
          echo "-> Rastreando las compuertas de variables de entorno reales en Bannerlator..."
          
          # Buscamos los archivos core de Winlator/Bannerlator donde se estructuran las variables de entorno de la botella
          TARGET_FILES=$(find . -name "Container.java" -o -name "XServerService.java" -o -name "EnvVars.java" -o -name "ShortcutsActivity.java")
          
          for file in $TARGET_FILES; do
            if [ -f "$file" ]; then
              echo "-> Saneando y soldando valvula de escape anti-overflow en: $file"
              sed -i 's/\r$//' "$file"
              
              # LA JUGADA MAESTRA RECTIFICADA: Inyectamos el parche usando la estructura real envVars.put de factoria
              # Al estar protegido, forzara la purga radical de RAM en tu Unisoc T618 inmediatamente al terminar los combates
              sed -i '/envVars.put/i\        envVars.put("MALLOC_TRIM_THRESHOLD_", "65536");\n        envVars.put("VK_ICD_FILENAMES_32", "/usr/share/vulkan/icd.d/icd_wrapper.json");\n        envVars.put("DXVK_FILTER_DEVICE_NAME", "Mali");' "$file"
            fi
          done

      - name: Conceder Permisos de Ejecución al Compilador Gradlew
        run: chmod +x gradlew

      - name: Compilar el APK Oficial Modificado (Prensa Gradle Debug/Release)
        run: |
          # Compilamos en modo Debug primero para asegurar las llaves de testeo nativas y evitar rechazos de firmas en tu telefono
          ./gradlew assembleDebug --no-daemon

      - name: Rastrear y Redirigir el APK cocinado de Factoría
        run: |
          FINAL_APK=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -z "$FINAL_APK" ]; then
            FINAL_APK=$(find . -name "*.apk" | head -n 1)
          fi
          echo "APK_OUTPUT_PATH=$FINAL_APK" >> $GITHUB_ENV
          echo "=== APK DEFINITIVO DETECTADO EN LA RUTA: $FINAL_APK ==="

      - name: Subir APK de Bannerlator Modificado a GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Bannerlator-Unisoc-T618-Mali
          path: ${{ env.APK_OUTPUT_PATH }}
          if-no-files-found: error
