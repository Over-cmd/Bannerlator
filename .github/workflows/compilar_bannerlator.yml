name: Build Bannerlator Optimized for Android 11

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 1. Clonar codigo fuente de Bannerlator
      uses: actions/checkout@v4

    - name: ⚙️ 2. Configurar Entorno de Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: 🤖 3. Configurar Android SDK y NDK
      uses: android-actions/setup-android@v3

    - name: 🏗️ 4. Compilar APK Oficial via Gradle en la Nube
      run: |
        chmod +x ./gradlew
        ./gradlew assembleRelease --no-daemon

    - name: 📤 5. Subir APK Optimizado a los Artefactos
      uses: actions/upload-artifact@v4
      with:
        name: Bannerlator-Bifrost-Android11-APK
        path: app/build/outputs/apk/release/*.apk
