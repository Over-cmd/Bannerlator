name: Forja del APK de Bannerlator Oficial Puro MALI

on:
  workflow_dispatch:

jobs:
  build-bannerlator-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio de Bannerlator (Restauración de Fábrica)
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Deshacer Cambios y Purgar Residuos Corruptos
        run: |
          echo "-> Purgando modificaciones viejas y restaurando el codigo Java original..."
          # Forzamos a git a limpiar cualquier alteracion en caliente para sanar el cerebro del APK
          git reset --hard HEAD
          git clean -fdx

      - name: Configurar Entorno de Java (JDK 17 reglamentario)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Activar Android SDK y NDK del Servidor
        uses: android-actions/setup-android@v3

      - name: Conceder Permisos de Ejecución al Compilador Gradlew
        run: chmod +x gradlew

      - name: Compilar el APK Oficial Inmaculado (Prensa Gradle Build)
        run: |
          # Forzamos la tarea de ensamblado limpia en modo Debug para asegurar el éxito del arranque
          ./gradlew assembleDebug --no-daemon

      - name: Rastrear y Redirigir el APK Final Sano
        run: |
          FINAL_APK=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -z "$FINAL_APK" ]; then
            FINAL_APK=$(find . -name "*.apk" | head -n 1)
          fi
          echo "APK_OUTPUT_PATH=$FINAL_APK" >> $GITHUB_ENV
          echo "=== APK SANO DETECTADO EN LA RUTA: $FINAL_APK ==="

      - name: Subir APK de Bannerlator Puro a GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Bannerlator-Oficial-Mali
          path: ${{ env.APK_OUTPUT_PATH }}
          if-no-files-found: error
