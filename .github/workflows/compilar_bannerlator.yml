name: Forja del APK de Bannerlator MALI Unisoc T618

on:
  workflow_dispatch:

jobs:
  build-bannerlator-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio de Bannerlator
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Restauración de Fábrica del Código
        run: |
          git reset --hard HEAD
          git clean -fdx

      - name: Configurar Entorno de Java (JDK 17 de Factoría)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Activar Android SDK y NDK del Servidor
        uses: android-actions/setup-android@v3

      - name: Modificación Quirúrgica del Silicio (Inyección Anti-Overflow MALI)
        run: |
          echo "-> Localizando el archivo core XServerService.java..."
          XSERVER_FILE=$(find app/src/main/ -name "XServerService.java" | head -n 1)
          
          if [ -n "$XSERVER_FILE" ] && [ -f "$XSERVER_FILE" ]; then
            echo "-> Soldando parches de memoria Bionic en el arranque de la botella..."
            
            # Buscamos la inyección estándar de Android (LD_LIBRARY_PATH) que el APK usa de fábrica
            # e inyectamos justo debajo las variables que obligan al emulador a purgar la caché
            # de texturas cada vez que se liberen 64KB, salvando tu GPU Mali-G52 MP2.
            sed -i '/envVars.put("LD_LIBRARY_PATH"/a\        envVars.put("MALLOC_TRIM_THRESHOLD_", "65536");\n        envVars.put("VK_ICD_FILENAMES_32", "/usr/share/vulkan/icd.d/icd_wrapper.json");\n        envVars.put("DXVK_FILTER_DEVICE_NAME", "Mali");' "$XSERVER_FILE"
            
            echo "-> Modificación inyectada con éxito sin alterar la sintaxis de Java."
          else
            echo "Error crítico: No se encontró XServerService.java en el árbol de recursos."
            exit 1
          fi

      - name: Conceder Permisos de Ejecución al Compilador Gradle
        run: chmod +x gradlew

      - name: Compilar el APK Oficial Modificado (Prensa Gradle Build)
        run: |
          # Compilamos en modo Debug para asegurar las firmas multiplataforma y evitar pánicos en Android
          ./gradlew assembleDebug --no-daemon

      - name: Rastrear el APK Cocinado de Factoría
        run: |
          APK_PATH=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" | head -n 1)
          fi
          echo "APK_OUTPUT_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "=== APK MONOLÍTICO SANO DETECTADO: $APK_PATH ==="

      - name: Subir APK Modificado a GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Bannerlator-Unisoc-T618-Mali
          path: ${{ env.APK_OUTPUT_PATH }}
          if-no-files-found: error
