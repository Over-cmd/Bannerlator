name: Forja del APK de Bannerlator MALI Unisoc T618

on:
  workflow_dispatch:

jobs:
  build-bannerlator-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio de Bannerlator
        uses: actions/checkout@v4
        with:
          submodules: 'false'
          fetch-depth: 0

      - name: 🧹 1. Restauración de Fábrica del Código Inicial
        run: |
          git reset --hard HEAD
          git clean -fdx

      - name: 🔗 2. Reparación de Submódulos Caídos (Fix bionic-fg)
        run: |
          echo "-> Reparando redirecciones de submódulos huérfanos..."
          if [ -f ".gitmodules" ]; then
            git submodule sync
          fi
          git submodule update --init --force || true

      - name: ⚙️ 3. Configurar Entorno de Java (JDK 17 de Factoría)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🤖 4. Activar Android SDK y NDK del Servidor
        uses: android-actions/setup-android@v3

      - name: 🛠️ 5. Parche Maestro (Target SDK 30, Puntero Siempre Visible y Anti-Fuga de Memoria)
        run: |
          echo "-> PARCHE GRADO TARGET SDK 30: Forzando dinámicamente la compatibilidad nativa con Android 11..."
          find . -name "build.gradle*" -exec sed -i -E 's/targetSdkVersion[[:space:]]+[0-9]+/targetSdkVersion 30/g' {} + || true
          find . -name "build.gradle*" -exec sed -i -E 's/targetSdk[[:space:]]*=[[:space:]]*[0-9]+/targetSdk = 30/g' {} + || true
          find . -name "build.gradle*" -exec sed -i -E 's/targetSdk[[:space:]]+[0-9]+/targetSdk 30/g' {} + || true

          echo "-> Buscando quirúrgicamente la actividad principal para inyectar propiedades sin romper dependencias..."
          MAIN_ACTIVITY=$(find app/src/main/ -name "MainActivity.java" | head -n 1)
          if [ -n "$MAIN_ACTIVITY" ] && [ -f "$MAIN_ACTIVITY" ]; then
            echo "-> Aplicando inyección de silicio anti-stuttering en: $MAIN_ACTIVITY"
            sed -i 's/\r$//' "$MAIN_ACTIVITY"
            # Aseguramos la inyección limpia sobre la firma estándar de Android
            sed -i 's|super.onCreate(savedInstanceState);|System.setProperty("MALLOC_TRIM_THRESHOLD_", "131072"); System.setProperty("DXVK_FILTER_DEVICE_NAME", "Mali"); super.onCreate(savedInstanceState);|g' "$MAIN_ACTIVITY" || true
          else
            XSERVER_FILE=$(find app/src/main/ -name "XServerView.java" | head -n 1)
            if [ -n "$XSERVER_FILE" ]; then
              sed -i 's/\r$//' "$XSERVER_FILE"
              sed -i 's|super.onCreate(savedInstanceState);|System.setProperty("MALLOC_TRIM_THRESHOLD_", "131072"); System.setProperty("DXVK_FILTER_DEVICE_NAME", "Mali"); super.onCreate(savedInstanceState);|g' "$XSERVER_FILE" || true
            fi
          fi

          echo "-> Forzando al entorno X11/Wine a no ocultar el cursor bajo ninguna circunstancia..."
          # SOLUCIÓN CRÍTICA: Paréntesis escapados '\(' y '\)' para que find agrupe correctamente el operador OR (-o)
          find app/src/main/ \( -name "*.sh" -o -name "*.json" -o -name "*.xml" \) -exec sed -i 's|"show_cursor": false|"show_cursor": true|g' {} + || true
          find app/src/main/ \( -name "*.sh" -o -name "*.json" -o -name "*.xml" \) -exec sed -i 's|"hardware_cursor": true|"hardware_cursor": false|g' {} + || true
          find app/src/main/ \( -name "*.sh" -o -name "*.json" -o -name "*.xml" \) -exec sed -i 's|cursor_visible=false|cursor_visible=true|g' {} + || true

          echo "-> Configurando los recursos de strings globales para inyectar flags de visibilidad absoluta..."
          find app/src/main/ -name "strings.xml" -exec sed -i 's|</resources>|  <string name="default_malloc_trim">131072</string>\n  <string name="default_dxvk_filter">Mali</string>\n  <string name="show_hardware_cursor">false</string>\n  <string name="cursor_visible">true</string>\n  <string name="force_software_cursor">true</string>\n  <string name="enable_mouse_warp">false</string>\n</resources>|g' {} + || true
          echo "-> Modificación quirúrgica y actualización de Target SDK completada de forma segura."

      - name: 🔑 6. Conceder Permisos de Ejecución al Compilador Gradle
        run: chmod +x gradlew

      - name: 🏗️ 7. Compilar el APK Oficial Modificado (Gradle con Anti-Congelación)
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx5632m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.configureondemand=false"
        run: |
          ./gradlew clean --no-daemon
          ./gradlew assembleDebug --no-daemon --no-build-cache --stacktrace

      - name: 📂 8. Rastrear el APK Cocinado de Factoría
        run: |
          APK_PATH=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" | head -n 1)
          fi
          echo "APK_OUTPUT_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "=== APK MONOLÍTICO SANO DETECTADO: $APK_PATH ==="

      - name: 📤 9. Subir APK Modificado a GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Bannerlator-Unisoc-T618-Mali
          path: ${{ env.APK_OUTPUT_PATH }}
          if-no-files-found: error
