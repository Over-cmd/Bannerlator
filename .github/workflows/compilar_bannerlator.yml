name: Forja del APK de Bannerlator MALI Unisoc T618

on:
  workflow_dispatch:

jobs:
  build-bannerlator-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio de Bannerlator
        uses: actions/checkout@v4
        with:
          submodules: 'false'
          fetch-depth: 0

      - name: Reparación de Submódulos Caídos (Fix bionic-fg)
        run: |
          echo "-> Reparando redirecciones de submódulos huérfanos..."
          if [ -f ".gitmodules" ]; then
            sed -i 's|https://github.com|https://github.com|g' .gitmodules || true
            git submodule sync
          fi
          git submodule update --init --force || true

      - name: Restauración de Fábrica del Código
        run: |
          git reset --hard HEAD
          git clean -fdx

      - name: Configurar Entorno de Java (JDK 17 de Factoría)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Activar Android SDK y NDK del Servidor
        uses: android-actions/setup-android@v3

      - name: Modificación Segura de Recursos (Inyección de Silicio & Mouse)
        run: |
          echo "-> Insertando configuraciones optimizadas mediante cadenas globales seguras..."
          # Buscamos todos los archivos strings.xml para inyectar parámetros sin alterar el compilador de Java/Kotlin
          # Esto evita el error de compilación (:app:compileStandardDebugKotlin) de raíz.
          find app/src/main/ -name "strings.xml" -exec sed -i 's|</resources>|  <string name="default_malloc_trim">65536</string>\n  <string name="default_dxvk_filter">Mali</string>\n  <string name="mouse_polling_rate_cap">60</string>\n  <string name="low_latency_touch">true</string>\n</resources>|g' {} + || true
          echo "-> Parche global estático aplicado de forma lícita."

      - name: Conceder Permisos de Ejecución al Compilador Gradle
        run: chmod +x gradlew

      - name: Compilar el APK Oficial Modificado (Prensa Gradle Build Debug)
        run: |
          # Añadimos limpieza previa para eliminar cualquier caché corrupta anterior
          ./gradlew clean
          ./gradlew assembleDebug --no-daemon

      - name: Rastrear el APK Cocinado de Factoría
        run: |
          APK_PATH=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" | head -n 1)
          fi
          echo "APK_OUTPUT_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "=== APK MONOLÍTICO SANO DETECTADO: $APK_PATH ==="

      - name: Subir APK Modificado a GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Bannerlator-Unisoc-T618-Mali
          path: ${{ env.APK_OUTPUT_PATH }}
          if-no-files-found: error
