name: Forja del APK de Bannerlator MALI Unisoc T618

on:
  workflow_dispatch:

jobs:
  build-bannerlator-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio de Bannerlator
        uses: actions/checkout@v4
        with:
          # Desactivamos la recursividad nativa para evitar que el submódulo inexistente rompa el flujo
          submodules: 'false'
          fetch-depth: 0

      - name: Reparación de Submódulos Caídos (Fix bionic-fg)
        run: |
          echo "-> Reparando redirecciones de submódulos huérfanos..."
          # Si el repositorio de bionic-fg original está roto, lo redirigimos a una copia espejo funcional si existe,
          # o forzamos a Git a inicializar solo los componentes válidos de vkbasalt y dependencias estables.
          if [ -f ".gitmodules" ]; then
            sed -i 's|https://github.com/The412Banner/bionic-fg.git|https://github.com|g' .gitmodules || true
            git submodule sync
          fi
          
          # Inicializamos los submódulos ignorando errores fatales de repositorios borrados
          git submodule update --init --force || true

      - name: Restauración de Fábrica del Código
        run: |
          git reset --hard HEAD
          git clean -fdx

      - name: Configurar Entorno de Java (JDK 17 de Factoría)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Activar Android SDK y NDK del Servidor
        uses: android-actions/setup-android@v3

      - name: Modificación Quirúrgica del Silicio (Inyección Anti-Overflow MALI Dinámica)
        run: |
          echo "-> Rastreando dinámicamente el archivo maestro de variables de entorno de Bannerlator..."
          TARGET_FILE=$(grep -rl "envVars.put" app/src/main/ || grep -rl "environment.put" app/src/main/ || true)
          if [ -z "$TARGET_FILE" ]; then
            TARGET_FILE=$(grep -rl "envVars.put" . || grep -rl "environment.put" . | head -n 1)
          fi
          ENV_FILE=$(echo "$TARGET_FILE" | head -n 1)
          
          if [ -n "$ENV_FILE" ] && [ -f "$ENV_FILE" ]; then
            echo "-> Archivo core lícito detectado en la ruta: $ENV_FILE"
            sed -i 's/\r$//' "$ENV_FILE"
            sed -i 's|envVars.put(|envVars.put("MALLOC_TRIM_THRESHOLD_", "65536"); envVars.put("VK_ICD_FILENAMES_32", "/usr/share/vulkan/icd.d/icd_wrapper.json"); envVars.put("DXVK_FILTER_DEVICE_NAME", "Mali"); envVars.put(|g' "$ENV_FILE" || \
            sed -i 's|environment.put(|environment.put("MALLOC_TRIM_THRESHOLD_", "65536"); environment.put("VK_ICD_FILENAMES_32", "/usr/share/vulkan/icd.d/icd_wrapper.json"); environment.put("DXVK_FILTER_DEVICE_NAME", "Mali"); environment.put(|g' "$ENV_FILE"
            echo "-> Inyección de silicio completada con éxito."
          else
            echo "-> Alshain: Mapeando inyección de respaldo directa a través de strings globales..."
            find app/src/main/ -name "strings.xml" -exec sed -i 's|</resources>|  <string name="default_malloc_trim">65536</string>\n  <string name="default_dxvk_filter">Mali</string>\n</resources>|g' {} + || true
          fi

      - name: Conceder Permisos de Ejecución al Compilador Gradle
        run: chmod +x gradlew

      - name: Compilar el APK Oficial Modificado (Prensa Gradle Build Debug)
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Rastrear el APK Cocinado de Factoría
        run: |
          APK_PATH=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" | head -n 1)
          fi
          echo "APK_OUTPUT_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "=== APK MONOLÍTICO SANO DETECTADO: $APK_PATH ==="

      - name: Subir APK Modificado a GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Bannerlator-Unisoc-T618-Mali
          path: ${{ env.APK_OUTPUT_PATH }}
          if-no-files-found: error
