name: Forja del APK de Bannerlator MALI Unisoc T618

on:
  workflow_dispatch:

jobs:
  build-bannerlator-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio de Bannerlator
        uses: actions/checkout@v4
        with:
          submodules: 'false'
          fetch-depth: 0

      - name: Reparación de Submódulos Caídos (Fix bionic-fg)
        run: |
          echo "-> Reparando redirecciones de submódulos huérfanos..."
          if [ -f ".gitmodules" ]; then
            sed -i 's|https://github.com|https://github.com|g' .gitmodules || true
            git submodule sync
          fi
          git submodule update --init --force || true

      - name: Restauración de Fábrica del Código
        run: |
          git reset --hard HEAD
          git clean -fdx

      - name: Configurar Entorno de Java (JDK 17 de Factoría)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Activar Android SDK y NDK del Servidor
        uses: android-actions/setup-android@v3

      - name: Parche Maestro (Puntero Visible Siempre y Anti-Fuga de Memoria)
        run: |
          echo "-> Inyectando propiedades del sistema para estabilizar la GPU Mali y la RAM..."
          # Buscamos el archivo de inicialización principal para inyectar configuraciones críticas del sistema operativo
          MAIN_FILE=$(find app/src/main/ -name "MainActivity.java" -o -name "XServerView.java" | head -n 1)
          if [ -n "$MAIN_FILE" ] && [ -f "$MAIN_FILE" ]; then
            sed -i 's/\r$//' "$MAIN_FILE"
            # Limitamos la caché y evitamos el desbordamiento de memoria (Leak) en juegos de 32/64 bits
            sed -i 's|super.onCreate(|System.setProperty("MALLOC_TRIM_THRESHOLD_", "65536"); System.setProperty("DXVK_FILTER_DEVICE_NAME", "Mali"); super.onCreate(|g' "$MAIN_FILE" || true
          fi

          echo "-> Forzando al entorno X11/Wine a no ocultar el cursor bajo ninguna circunstancia..."
          # Buscamos cualquier script shell o de inicialización del entorno Wine que configure el puntero
          find app/src/main/ -name "*.sh" -o -name "*.json" -exec sed -i 's|"show_cursor": false|"show_cursor": true|g' {} + || true
          find app/src/main/ -name "*.sh" -o -name "*.json" -exec sed -i 's|"hardware_cursor": true|"hardware_cursor": false|g' {} + || true

          echo "-> Configurando los recursos de strings globales para inyectar flags de visibilidad absoluta..."
          find app/src/main/ -name "strings.xml" -exec sed -i 's|</resources>|  <string name="default_malloc_trim">65536</string>\n  <string name="default_dxvk_filter">Mali</string>\n  <string name="show_hardware_cursor">false</string>\n  <string name="cursor_visible">true</string>\n  <string name="force_software_cursor">true</string>\n  <string name="enable_mouse_warp">false</string>\n</resources>|g' {} + || true
          echo "-> Modificación quirúrgica de controles completada."

      - name: Conceder Permisos de Ejecución al Compilador Gradle
        run: chmod +x gradlew

      - name: Compilar el APK Oficial Modificado (Prensa Gradle Build con Anti-Congelación)
        run: |
          ./gradlew clean
          ./gradlew assembleDebug \
            --no-daemon \
            -Dorg.gradle.daemon=false \
            -Dkotlin.compiler.execution.strategy="in-process" \
            -Porg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC"

      - name: Rastrear el APK Cocinado de Factoría
        run: |
          APK_PATH=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" | head -n 1)
          fi
          echo "APK_OUTPUT_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "=== APK MONOLÍTICO SANO DETECTADO: $APK_PATH ==="

      - name: Subir APK Modificado a GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Bannerlator-Unisoc-T618-Mali
          path: ${{ env.APK_OUTPUT_PATH }}
          if-no-files-found: error
