name: Compilar APK de Bannerlator

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4
        with:
          submodules: 'recursive' # Clona submódulos si tu proyecto los requiere
          fetch-depth: 0

      - name: Configurar Entorno de Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configurar Android SDK y NDK
        uses: android-actions/setup-android@v3

      - name: Conceder Permisos de Ejecución a Gradle
        run: chmod +x gradlew

      - name: Compilar APK (Limpieza y Construcción)
        run: |
          ./gradlew clean
          ./gradlew assembleDebug \
            --no-daemon \
            -Dorg.gradle.daemon=false \
            -Dkotlin.compiler.execution.strategy="in-process" \
            -Porg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC"

      - name: Localizar Archivo APK Generado
        run: |
          APK_PATH=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" | head -n 1)
          fi
          echo "APK_OUTPUT_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "=== APK Encontrado: $APK_PATH ==="

      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Bannerlator-Debug-APK
          path: ${{ env.APK_OUTPUT_PATH }}
          if-no-files-found: error
